# Cloudflare Worker for the app's Q&A assistant. Secrets (set by setup.sh,
# never stored here): GEMINI_API_KEY, APP_TOKEN.
name = "nail-vitals-assistant"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# Check what the key can use with GET /models (setup.sh prints it).
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash"

[observability]
enabled = true
